name: Remark

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'package.json'
      - 'patches/**'
      - 'specs/dependency-security.mjs'
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'package.json'
      - 'patches/**'
      - 'specs/dependency-security.mjs'

permissions:
  contents: read

jobs:
  remark:
    name: Remark

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set Up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Dependencies
        run: bun ci

      - name: Verify Dependency Backports
        run: node specs/dependency-security.mjs

      - name: Lint
        run: bun remark . --quiet --frail
